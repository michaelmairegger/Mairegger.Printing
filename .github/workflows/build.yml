name: Build
on:
  push:
    branches:
    - '**'
    # release lines are built, tested and published by publish.yml
    - '!release/v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - uses: ./.github/actions/build-and-test
