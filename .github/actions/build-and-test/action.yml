name: 'Compile, test'
description: 'Compiles and tests the project'
inputs:
  buildConfiguration:
    description: Defines the build configuration like Debug or Release
    required: true
  workingDirectory:
    description: Defines the base working directory containing the solution file
    required: true

outputs:
  nuget-package-version:
    description: Returns the nuget package version
    value: ${{ steps.nbgv.outputs.NuGetPackageVersion }}

runs:
  using: "composite"
  steps:
  - uses: actions/setup-dotnet@v5
    with:
      dotnet-version: '10.0.x'
  - name: Build
    shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ inputs.buildConfiguration }}
    run: dotnet build --configuration $env:BUILD_CONFIGURATION
    working-directory: ${{ inputs.workingDirectory }}

  - name: Test
    shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ inputs.buildConfiguration }}
    run: dotnet test --configuration $env:BUILD_CONFIGURATION --no-build --coverage --coverage-output-format cobertura
    working-directory: ${{ inputs.workingDirectory }}
